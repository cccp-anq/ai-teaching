spring:
  application:
    name: ai-teaching-backend
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1025MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  sql:
    init:
      mode: never
logging:
  pattern:
    level: '%5p [requestId=%X{requestId:-}]'
server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}
  tomcat:
    # Let Spring finish oversized multipart requests and return its structured 413 body.
    max-swallow-size: ${SERVER_TOMCAT_MAX_SWALLOW_SIZE:-1}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
app:
  identity:
    username-only-login-enabled: ${USERNAME_ONLY_LOGIN_ENABLED:false}
    username-only-login-confirmation: ${USERNAME_ONLY_LOGIN_CONFIRMATION:}
  storage:
    root: ${FILE_STORAGE_DIR:./.work/files}
  classroom-analysis:
    max-video-bytes: ${CLASSROOM_VIDEO_MAX_BYTES:1073741824}
    # The executable is supplied by the deployment; the repository does not bundle ffprobe.
    ffprobe-path: ${CLASSROOM_FFPROBE_PATH:ffprobe}
    media-probe-timeout-seconds: ${CLASSROOM_MEDIA_PROBE_TIMEOUT_SECONDS:30}
    duration-tolerance-ms: ${CLASSROOM_DURATION_TOLERANCE_MS:2000}
    # False means uploads are stored and automatic jobs wait for the two real modules.
    # Enable only in an explicit demo/test environment; reports are visibly marked SIMULATED.
    mock-modules-enabled: ${CLASSROOM_MOCK_MODULES_ENABLED:false}
    # Real module orchestration is fail-closed until every URL, provider and secret below is supplied.
    integration-enabled: ${CLASSROOM_MODULE_INTEGRATION_ENABLED:false}
    public-base-url: ${CLASSROOM_PUBLIC_BASE_URL:}
    media-signing-key: ${CLASSROOM_MEDIA_SIGNING_KEY:}
    media-url-ttl-seconds: ${CLASSROOM_MEDIA_URL_TTL_SECONDS:900}
    worker-delay-ms: ${CLASSROOM_WORKER_DELAY_MS:2000}
    worker-initial-delay-ms: ${CLASSROOM_WORKER_INITIAL_DELAY_MS:60000}
    batch-size: ${CLASSROOM_WORKER_BATCH_SIZE:10}
    lease-seconds: ${CLASSROOM_WORKER_LEASE_SECONDS:60}
    poll-interval-ms: ${CLASSROOM_MODULE_POLL_INTERVAL_MS:2000}
    request-timeout-seconds: ${CLASSROOM_MODULE_REQUEST_TIMEOUT_SECONDS:10}
    response-max-bytes: ${CLASSROOM_MODULE_RESPONSE_MAX_BYTES:8388608}
    max-consecutive-failures: ${CLASSROOM_MODULE_MAX_FAILURES:20}
    # Includes the initial attempt, so the default permits at most three paid rebuilds per module.
    max-module-attempts: ${CLASSROOM_MODULE_MAX_ATTEMPTS:4}
    job-deadline-seconds: ${CLASSROOM_MODULE_JOB_DEADLINE_SECONDS:7200}
    transcription:
      base-url: ${TRANSCRIPTION_MODULE_BASE_URL:}
      bearer-token: ${TRANSCRIPTION_MODULE_BEARER_TOKEN:}
      provider-id: ${TRANSCRIPTION_MODULE_PROVIDER_ID:}
      module-version: ${TRANSCRIPTION_MODULE_VERSION:}
    head-up:
      base-url: ${HEADUP_MODULE_BASE_URL:}
      bearer-token: ${HEADUP_MODULE_BEARER_TOKEN:}
      provider-id: ${HEADUP_MODULE_PROVIDER_ID:}
      module-version: ${HEADUP_MODULE_VERSION:}
      window-ms: ${HEADUP_MODULE_WINDOW_MS:10000}
      definition-id: ${HEADUP_MODULE_DEFINITION_ID:head-up-attendance-qwen-vl-v2}
    # Automatic AI report egress is explicitly disabled by default. Only de-identified
    # evidence packets leave the service when enabled and a key is supplied.
    report:
      enabled: ${CLASSROOM_REPORT_ENABLED:false}
      base-url: ${CLASSROOM_REPORT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${CLASSROOM_REPORT_API_KEY:}
      model: ${CLASSROOM_REPORT_MODEL:qwen3.7-plus}
      timeout-seconds: ${CLASSROOM_REPORT_TIMEOUT_SECONDS:30}
      max-output-tokens: ${CLASSROOM_REPORT_MAX_OUTPUT_TOKENS:1024}
      call-ceiling-cents: ${CLASSROOM_REPORT_CALL_CEILING_CENTS:100}
      total-cap-cents: ${CLASSROOM_REPORT_TOTAL_CAP_CENTS:2000}
      batch-size: ${CLASSROOM_REPORT_BATCH_SIZE:2}
      lease-seconds: ${CLASSROOM_REPORT_LEASE_SECONDS:120}
